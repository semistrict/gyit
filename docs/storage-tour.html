const updateStages=[['A one-file commit arrives','src/main.go changes. Its new blob and the changed Git tree/commit objects are acquired.'],['Write new pack data','Upload new immutable pack segments. Existing pack objects stay in place.'],['Build changed metadata','Rebuild affected filesystem/history directory pages and record path-change events. Reuse unchanged subtrees and identical pages.'],['Write a new index root','Write changed global-index pages and an immutable generation manifest. All dependencies must finish uploading first.'],['Publish with compare-and-swap','Replace HEAD only if its version token still matches the writer’s expected value. Readers never see a partially uploaded graph.']];
function updates(){const cur=updateStages[state.update];return `${heading(6,'A new version.<br><em>Without rewriting the old one.</em>','Follow a one-file change. New immutable objects are written first; one atomic HEAD replacement publishes them.',true)}<div class="grid2"><div><div class="panel diagram">${updateDiagram()}</div><div class="row between gap"><div class="row"><button class="btn" data-update>${state.update===4?'Restart simulation ↺':state.update===3?'Publish HEAD →':'Next write →'}</button><span class="micro">${state.update+1} / 5</span></div><button class="pill-switch" data-conflict aria-pressed="${state.conflict}">Simulate CAS conflict</button></div></div><div class="panel pad"><div class="label">publication stage</div><div class="step-caption"><span class="big">${state.update+1}</span><div><h3>${state.update===4&&state.conflict?'Publication rejected':cur[0]}</h3><p>${state.update===4&&state.conflict?'The expected HEAD token is stale. The new graph stays unpublished; the existing published root remains usable. A failed writer cannot overwrite the newer publication.':cur[1]}</p></div></div><div class="note"><strong>Publishing availability does not switch every checkout.</strong> Existing mounts keep their selected revision. An explicit checkout or update changes that mount’s selection.</div><div class="callout-stat"><div><span class="label">synthetic one-file update</span><p class="small">100-directory test repository</p></div><strong>~12.7 KiB</strong></div><p class="micro gap">Measured additional history metadata, four writes. Not a universal per-commit cost. Large affected directories require more work.</p><p class="micro gap">Old generations and failed unpublished objects are not garbage-collected by the current change.</p></div></div>`}
const phases=[['Commit + trees','A shallow, blobless acquisition resolves the chosen revision and makes its tree available.','Directories can be discovered from Git trees. Exact file sizes require additional object metadata or contents.'],['Current contents','Acquire current file contents and prepare size-bearing directory pages.','Prepared scans descend directory references without fetching file bodies. Content reads remain on demand for the reader.'],['History metadata','Deepen acquisition in resumable batches with historical blobs filtered out.','Commit/tree history arrives in the background while the selected filesystem remains usable.'],['Path history index','Build the all-path history graph from acquired commit and tree metadata.','Literal file-log queries become available for the indexed revision. Historical file contents remain demand-fetched.']];
function acquisition(){const p=phases[state.phase];return `${heading(7,'Durable data and cache<br><em>are different budgets.</em>','Acquisition is progressive. The object store retains repository data; each reader can evict its decoded cache without losing history.',true)}<div class="phase-track" role="group" aria-label="Acquisition phases">${phases.map((v,i)=>`<button data-phase="${i}" class="${state.phase===i?'active':''}"><span class="phase-n">0${i+1}</span><h3>${v[0]}</h3><p>${['start with the selected revision','prepare filesystem metadata','continue in the background','make first queries ready'][i]}</p></button>`).join('')}</div><div class="phase-detail"><div class="panel pad"><div class="label">${p[0]}</div><h2 class="gap">${['Mount early.','Scan metadata.','Stream ancestry.','Query the graph.'][state.phase]}</h2><p class="small gap">${p[1]} ${p[2]}</p><div class="notice-preview gap">${state.phase<2?'NOTICE\ngyit: preparing the repository…\n\nOnly shown if initial setup exceeds 10 s.':'The selected revision remains mounted.\nBackground work adds availability.\nIt does not silently change your files.'}</div><div class="note"><strong>The writer has acquisition packs and scratch files too.</strong> Those are separate from the reader’s evictable cache. On a Mac, both durable storage and cache may happen to use local disk.</div></div><div class="panel pad"><div class="row between"><span class="label blue">one decoded local cache</span><button class="btn secondary" data-evict>${state.evicted?'Refill cache ↺':'Evict cache entries'}</button></div><div class="cache-shelves">${['index<br>container','directory<br>pages','history<br>container','decoded<br>blob'].map((x,i)=>`<div class="cache-tile ${state.evicted&&i<3?'evicted':''}">${x}<span style="font-size:20px;margin-top:9px">▤</span></div>`).join('')}</div><div class="row between"><span class="small">Illustrative occupancy</span><span class="mono blue">${state.evicted?'0.4':'2.8'} / 4 GiB</span></div><div class="big-meter"><span style="width:${state.evicted?10:70}%"></span></div><p class="small">One global limit across repositories and revisions in the mount/application. Default maximum: 4 GiB, reduced as needed to reserve 20 GiB free disk.</p><div class="note"><strong>mmap lets the OS manage RAM residency.</strong> The persistent cache stores decoded data. There is no separate persistent compressed cache tier.</div><div class="row gap">${tag('durable store unchanged','mint')}${tag('cache may be discarded','blue')}</div></div></div>`}
function measured(){return `${heading(8,'Measured, not imagined.','The accepted implementation is committed. These numbers describe the new reader benchmark; the interactive GCP mount was still running the previous build at handoff.',true)}<div class="grid2"><div class="panel chart"><div class="row between"><h2>File log · 10 entries</h2>${tag('GCE + native GCS')}</div><p class="small gap">Medium repository · README.md · identical formatted output</p><div style="margin-top:27px"><div class="chart-row"><span>gyit first</span><div class="bar-track"><span style="width:95%"></span></div><span class="peach">623 ms</span></div><div class="chart-row"><span>Git</span><div class="bar-track"><span class="git" style="width:25.8%"></span></div><span class="blue">169 ms</span></div><div class="chart-row"><span>gyit warm</span><div class="bar-track"><span class="warm" style="width:3.8%"></span></div><span class="mint">20–27 ms</span></div></div><div class="note"><strong>3.69× for the first reader; accepted.</strong> This exceeds the earlier 2× target. No previous file-log query had run, but the reader reused the importer’s cache. Guest control transport and pager startup are excluded.</div><div class="two-col gap"><div class="number-block"><div class="label">complete GCS history indexing</div><div class="result-number gap">103<span style="font-size:27px"> s</span></div></div><div class="number-block"><div class="label">local additional history data</div><div class="result-number gap">327<span style="font-size:27px"> MiB</span></div><p class="micro">10,934 reachable commits</p></div></div></div><div class="panel pad"><h2>Follow the implementation.</h2><p class="small gap">Schema and code links are pinned to the reviewed commit. This deck itself needs no network connection.</p><div class="source-links">${source('proto/gyit/storage/v1/progressive.proto','Storage protobuf')}${source('internal/repo/index.go','Global index')}${source('internal/repo/progressive_pack.go','Pack segments')}${source('internal/repo/progressive_directory.go','Filesystem pages')}${source('internal/repo/file_history_ingest.go','History ingestion')}${source('internal/repo/file_history_query.go','History traversal')}${source('internal/repo/file_history_cache.go','Decoded history cache')}${source('PATH_LOG_PERFORMANCE.md','Measurements & reproduction')}</div><div class="note"><strong>What remains outside this result:</strong> Linux-scale all-path indexing, a deployment to the live mount, and a guarantee that every larger result count stays within 2×. Some local 100-entry queries measured 2.8×.</div><button class="btn secondary gap" data-go="1">Return to the bucket ↗</button></div></div>`}
const lab={ready:false,loading:null,busy:false,events:[],selected:0,output:'Type a command. Watch the real reader follow references through the store.\n\nStart with ls -al, then cat README.md, then gyit log -n 10 README.md.\nRepeat a command to see which reads disappear.\n',cwd:'/',sha:'',summary:'Reader has not started.',command:'ls -al',pacing:160};
function laboratory(){return `${heading(9,'Your command.<br><em>The real reader.</em>','The production Go reader, compiled to WebAssembly. A tiny imported repository lives in this browser. Each packet below corresponds to an actual object-store Get call.',true)}<div class="lab-toolbar row between"><div class="row">${tag('Go → WebAssembly','mint')}${tag('12 commits · 28 files')}${tag('8 MiB memory cache','blue')}</div><label class="micro">Animation pacing <select id="lab-pacing" aria-label="Animation pacing"><option value="0" ${lab.pacing===0?'selected':''}>None</option><option value="160" ${lab.pacing===160?'selected':''}>160 ms / request</option><option value="400" ${lab.pacing===400?'selected':''}>400 ms / request</option></select></label></div><div class="lab-layout gap"><div class="panel lab-console"><div class="panel-head"><span class="label">orchard / command shell</span><span id="lab-ready" class="micro mint">${lab.ready?'Wasm ready':'Loads on first command'}</span></div><pre id="lab-output" tabindex="0" aria-label="Command output">${esc(lab.output)}</pre><form id="lab-form"><label id="lab-prompt" for="lab-command">${esc(lab.cwd)} $</label><input id="lab-command" name="command" autocomplete="off" spellcheck="false" value="${esc(lab.command)}" aria-label="Command"><button class="btn" id="lab-run" ${lab.busy?'disabled':''}>${lab.busy?'Running…':'Run ↵'}</button></form><div class="lab-presets">${['ls -al','cat README.md','gyit log -n 10 README.md','gyit checkout v1','gyit checkout main','cache clear','help'].map(c=>`<button class="quiet" data-command="${c}">${c}</button>`).join('')}</div></div><div class="panel lab-observer"><div class="panel-head"><span class="label">live object traffic</span><span id="lab-count" class="mono peach">0 GETs</span></div><div class="lab-flow" id="lab-flow">${svg(`${wire(225,90,375,90)}${wire(555,90,710,90)}${node(25,56,200,75,'Go reader','shared production code','on')}${node(375,56,180,75,'decoded cache','bounded memory','blue')}${node(710,56,210,75,'object store','embedded fixture','shared')}<path id="lab-packet" d="M235 89h14" stroke="#ffb394" stroke-width="6" stroke-linecap="round" opacity="0"/>`,180)}</div><div id="lab-summary" class="micro">${esc(lab.summary)}</div><div id="lab-requests" aria-label="Object request trace"></div><div id="lab-inspect"></div></div></div><div class="lab-notes"><p><strong>Real:</strong> protobuf decoding, index traversal, zstd frames, Git pack decoding, history queries and cache lookups. The fixture was created by the real repository importer.</p><p><strong>Simulated:</strong> remote transport and its delay. No S3 connection, OS mount, mmap or native Git process runs here. This is not a performance benchmark.</p></div>`}
function family(key){return key==='HEAD'?'Publication':key.startsWith('packs/')?'Git pack':key.startsWith('index/progressive-history-')?'History pages':key.startsWith('index/progressive-')?'Directory pages':'Global / reference index'}
function updateLab(){
 if(!$('#lab-output'))return;
 $('#lab-output').textContent=lab.output;$('#lab-output').scrollTop=$('#lab-output').scrollHeight;
 $('#lab-prompt').textContent=lab.cwd+' $';$('#lab-run').disabled=lab.busy;$('#lab-run').textContent=lab.busy?'Running…':'Run ↵';
 $('#lab-ready').textContent=lab.ready?'Wasm ready':lab.loading?'Loading Go reader…':'Loads on first command';
 $('#lab-count').textContent=lab.events.length+' GET'+(lab.events.length===1?'':'s');$('#lab-summary').textContent=lab.summary;
 $('#lab-requests').innerHTML=lab.events.length?lab.events.map((v,i)=>`<button data-request="${i}" class="request-row ${lab.selected===i?'selected':''} ${v.phase==='request'?'pending':''}"><span class="micro">${String(v.id).padStart(2,'0')}</span><span><strong>${family(v.key)}</strong><code>${esc(v.key)}</code></span><span>${v.phase==='request'?'…':v.bytes.toLocaleString()+' B'}</span></button>`).join(''):'<div class="lab-empty"><span>↗</span><p>Run a command to trace its reads.</p><p class="micro">A warm repeat may require zero GETs.</p></div>';
 const v=lab.events[lab.selected];$('#lab-inspect').innerHTML=v?`<div class="label">request ${v.id} · ${v.phase==='request'?'in flight':'response received'}</div><code class="lab-key">${esc(v.key)}</code><div class="row gap">${tag(v.length===-1?'whole object':`range ${v.offset}–${v.offset+v.length-1}`,'peach')}${tag(v.bytes+' returned bytes','mint')}</div><div class="micro gap">First ${v.preview?v.preview.length/2:0} stored bytes · hexadecimal</div><pre>${v.preview?esc(v.preview.match(/.{1,2}/g).join(' ')):'Waiting for response…'}</pre>`:'';
}
window.gyitOnEvent=v=>{
 if(v.phase==='request'){lab.events.push(v);lab.selected=lab.events.length-1}else{const i=lab.events.findIndex(x=>x.id===v.id);if(i>=0)lab.events[i]=v}
 lab.summary=v.phase==='request'?'GET '+family(v.key).toLowerCase()+'…':'Decoded by the shared reader after this response.';
 updateLab();const p=$('#lab-packet');if(p&&!state.paused&&!matchMedia('(prefers-reduced-motion: reduce)').matches){p.animate([{transform:`translateX(${v.phase==='request'?0:460}px)`,opacity:1},{transform:`translateX(${v.phase==='request'?460:0}px)`,opacity:0}],{duration:Math.max(120,lab.pacing),fill:'forwards'})}
 const selected=$('#lab-requests .selected');if(selected)$('#lab-requests').scrollTop=selected.offsetTop-$('#lab-requests').clientHeight/2;
};
async function loadReader(){
 if(lab.ready)return;
 if(!lab.loading)lab.loading=(async()=>{
  if(!window.Go){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='assets/wasm_exec.js';s.onload=resolve;s.onerror=()=>reject(Error('Build the demo first: python3 scripts/build_storage_tour.py'));document.head.append(s)})}
  const goRuntime=new Go();let bytes;
  if(window.gyitWasmBase64){const s=atob(window.gyitWasmBase64);bytes=Uint8Array.from(s,c=>c.charCodeAt(0))}else{const r=await fetch('assets/gyit.wasm');if(!r.ok)throw Error('Missing Wasm asset. Run scripts/build_storage_tour.py.');bytes=await r.arrayBuffer()}
  const result=await WebAssembly.instantiate(bytes,goRuntime.importObject);
  goRuntime.run(result.instance).catch(err=>{lab.ready=false;lab.summary='Wasm stopped: '+err.message;updateLab()});
  if(typeof window.gyitRun!=='function')throw Error('The Go reader did not initialize.');lab.ready=true;
 })();
 try{await lab.loading}catch(err){lab.loading=null;throw err}
}
async function runLab(command){
 if(lab.busy||!command.trim())return;
 lab.command=command;lab.busy=true;lab.events=[];lab.selected=0;lab.output+='\n'+lab.cwd+' $ '+command+'\n';lab.summary='Starting command…';updateLab();
 try{const loading=loadReader();updateLab();await loading;const r=await window.gyitRun(command,lab.pacing);lab.output+=r.output+(r.error?'error: '+r.error+'\n':'');lab.cwd=r.cwd;lab.sha=r.sha;lab.summary=`${r.requests} GET${r.requests===1?'':'s'} · ${r.bytes.toLocaleString()} bytes read${r.requests===0?' · no object reads required':''}${r.sha?' · revision '+r.sha.slice(0,8):''}`}
 catch(err){lab.output+='error: '+err.message+'\n';lab.summary='Reader unavailable.'}
 finally{lab.busy=false;if(lab.output.length>100000)lab.output=lab.output.slice(-100000);updateLab();$('#lab-command')?.focus({preventScroll:true})}
}
document.addEventListener('submit',e=>{if(e.target.id==='lab-form'){e.preventDefault();runLab($('#lab-command').value)}});
document.addEventListener('change',e=>{if(e.target.id==='lab-pacing')lab.pacing=Number(e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.command){$('#lab-command').value=b.dataset.command;runLab(b.dataset.command)}if(b.dataset.request!==undefined){lab.selected=Number(b.dataset.request);updateLab()}});

const scenes=[cover,bucket,pointer,filesystem,historyScene,reads,updates,acquisition,measured,laboratory];
function render(entrance=false){const focus=document.activeElement?.dataset;const key=focus?Object.keys(focus).find(k=>k!==''):null;const val=key?focus[key]:null;$('#main').innerHTML=`<section class="scene ${entrance?'enter':''}" aria-label="${chapters[state.slide]}">${scenes[state.slide]()}</section>`;$('#rail').innerHTML=chapters.map((name,i)=>`<button data-go="${i}" class="${state.slide===i?'active':''}" aria-label="Chapter ${i+1}: ${name}" ${state.slide===i?'aria-current="step"':''}>${String(i+1).padStart(2,'0')}<span class="tip">${name}</span></button>`).join('');$('#progress').style.width=((state.slide+1)/chapters.length*100)+'%';$('#page-count').textContent=`${String(state.slide+1).padStart(2,'0')} / ${chapters.length}`;$('#chapter-name').textContent=chapters[state.slide];$('#prev').disabled=state.slide===0;$('#next').textContent=state.slide===chapters.length-1?'Back to beginning ↺':'Next chapter →';$('#motion').textContent=state.paused?'Resume motion':'Pause motion';$('#motion').setAttribute('aria-pressed',state.paused);document.documentElement.style.setProperty('--motion',state.paused?'paused':'running');document.querySelectorAll('.wire.on').forEach(e=>e.style.animationPlayState=state.paused?'paused':'running');if(state.slide===9)updateLab();if(!entrance&&key){const prop=key.replace(/[A-Z]/g,x=>'-'+x.toLowerCase());[...document.querySelectorAll(`[data-${prop}]`)].find(e=>e.dataset[key]===val)?.focus({preventScroll:true})}}
function stop(){clearInterval(timer);timer=null;state.playing=false}
function go(n){stop();state.slide=(n+chapters.length)%chapters.length;window.history.replaceState(null,'','#'+(state.slide+1));render(true);if(state.slide===9)updateLab();$('#main').scrollTo(0,0);$('#announcement').textContent=`Chapter ${state.slide+1}: ${chapters[state.slide]}`}
function play(){if(state.playing){stop();render();return}if(state.step===3)state.step=0;state.playing=true;render();timer=setInterval(()=>{state.step++;if(state.step>=3){state.step=3;stop()}render()},1400)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.go!==undefined){go(+d.go);return}if(d.object){state.object=d.object;render()}else if(d.frame!==undefined){state.frame=+d.frame;render()}else if('decode'in d){state.decoded=!state.decoded;render()}else if(d.path){state.path=d.path;render()}else if(d.count){state.count=+d.count;render()}else if(d.op){stop();state.op=d.op;state.step=0;render()}else if('warm'in d){state.warm=!state.warm;render()}else if('play'in d){play()}else if('step'in d){stop();state.step=(state.step+1)%4;render()}else if(d.stepTo!==undefined){stop();state.step=+d.stepTo;render()}else if('reset'in d){stop();state.step=0;render()}else if('update'in d){state.update=(state.update+1)%5;render()}else if('conflict'in d){state.conflict=!state.conflict;render()}else if(d.phase!==undefined){state.phase=+d.phase;render()}else if('evict'in d){state.evicted=!state.evicted;render()}});
$('#prev').onclick=()=>go(state.slide-1);$('#next').onclick=()=>go(state.slide+1);$('#motion').onclick=()=>{state.paused=!state.paused;if(state.paused)stop();render()};$('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(state.slide+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();if(state.slide>0)go(state.slide-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(chapters.length-1)}});
window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=chapters.length&&n-1!==state.slide)go(n-1)});
const initial=Number(location.hash.slice(1));if(initial>=1&&initial<=chapters.length)state.slide=initial-1;state.paused=matchMedia('(prefers-reduced-motion: reduce)').matches;render(true);
</script>
