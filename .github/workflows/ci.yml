name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: go test ./... -count=1 -timeout=180s
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_publish_macos_release.py'
      - name: Build portable Linux command
        run: GOOS=linux CGO_ENABLED=0 go build -o .build/gyit-linux ./cmd/gyit
