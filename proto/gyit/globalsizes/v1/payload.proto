syntax = "proto3";

package gyit.globalsizes.v1;

option go_package = "gyit/internal/gen/gyit/globalsizes/v1;globalsizesv1";

// A retrieval table: its minimal perfect hash does not prove key membership.
message Payload {
  uint32 count = 1;
  repeated Level levels = 2;
  bytes sizes_le32 = 3;
  bytes large_sizes = 4;
}

message Level {
  uint64 seed = 1;
  uint32 bit_count = 2;
  uint32 base_ordinal = 3;
  bytes bitmap_le64 = 4;
  // Prefix popcount before each 512-bit block, with no terminal checkpoint.
  bytes ranks_le32 = 5;
}
