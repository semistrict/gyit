syntax = "proto3";

package gyit.control.v1;

option go_package = "gyit/internal/gen/gyit/control/v1;controlv1";

// Each control-file handle or Unix connection carries one request and response stream.
// Every message has a four-byte big-endian length prefix (maximum 64 KiB).
message Request {
  uint32 version = 1;
  oneof operation {
    StatusRequest status = 2;
    SwitchRequest switch = 3;
    LogRequest log = 4;
    DiffRequest diff = 5;
    BlameRequest blame = 6;
    // Separate operation so older servers reject path filtering instead of ignoring it.
    LogRequest path_log = 7;
    // Pathspec/follow semantics must be rejected by older servers.
    LogRequest history_log = 8;
    ViewRequest view = 9;
    UpdateRequest update = 10;
  }
}

message StatusRequest {}

// Resolve the mounted branch/tag again; commit identifiers remain pinned.
message UpdateRequest {}

message SwitchRequest {
  // Legacy full commit ID; new clients use revision.
  string sha = 1;
  string revision = 2;
}

message Response {
  uint32 version = 1;
  oneof result {
    Snapshot snapshot = 2;
    Error error = 3;
    LogEntry log_entry = 4;
    LogEnd log_end = 5;
    DiffChunk diff_chunk = 6;
    BlameLine blame_line = 7;
    StreamEnd stream_end = 8;
  }
}

// A status read is atomic. A switch response identifies the snapshot installed
// by that request; a subsequent request may already have changed it again.
message Snapshot {
  string sha = 1;
  string tree = 2;
  // Empty branch means detached HEAD.
  string branch = 3;
  string detached_at = 4;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_INTERNAL = 3;
  ERROR_CODE_UNSUPPORTED_VERSION = 4;
  ERROR_CODE_CANCELED = 5;
  ERROR_CODE_DEADLINE_EXCEEDED = 6;
  ERROR_CODE_NO_MATCH = 7;
}

// MountEndpoint is exposed as the user.gyit.control extended attribute on the
// mount root. Clients walk up from their working directory to discover it.
message MountEndpoint {
  uint32 version = 1;
  string socket = 2;
  // Virtual file served by FUSE; no separate socket or on-disk file is created.
  string control_file = 3;
}

// Log streams one LogEntry per frame, then LogEnd. An Error terminates a stream.
message LogRequest {
  string revision = 1;
  // Zero selects the default of 20; maximum 1000.
  uint32 max_count = 2;
  bool first_parent = 3;
  repeated bytes paths = 4;
  // If nonempty, revision was an unseparated argument that may instead name a path.
  bytes possible_path = 5;
  bool follow = 6;
  bytes path_prefix = 7;
  // Normal log displays full commit IDs; avoid unused abbreviation lookups.
  bool full_commit_ids = 8;
}

message LogEntry {
  string sha = 1;
  string short_sha = 2;
  repeated string parents = 3;
  bytes author = 4;
  int64 author_time = 5;
  int32 author_offset_minutes = 6;
  bytes message = 7;
  bool message_truncated = 8;
  bool author_truncated = 9;
  // One prefix length per parent avoids duplicating IDs in wide merge frames.
  bytes parent_abbrev_lengths = 10;
}

message LogEnd {}

// Diff streams patch bytes in bounded chunks, then StreamEnd.
message DiffRequest {
  string from_revision = 1;
  string to_revision = 2;
  repeated bytes paths = 3;
  bool name_only = 4;
  bool name_status = 5;
  uint32 context_lines = 6;
}
message DiffChunk { bytes data = 1; }

// Blame streams structured lines, then StreamEnd. Paths are literal and relative
// to the repository root; zero line bounds select the entire file.
message BlameRequest {
  string revision = 1;
  bytes path = 2;
  uint32 start_line = 3;
  uint32 end_line = 4;
  bool first_parent = 5;
  bool include_committer = 6;
}
message BlameLine {
  string sha = 1;
  bytes author = 2;
  int64 author_time = 3;
  int32 author_offset_minutes = 4;
  uint32 original_line = 5;
  uint32 final_line = 6;
  bytes content = 7;
  bool boundary = 8;
  bytes path = 9;
  bytes summary = 10;
  bool author_truncated = 11;
  bool message_truncated = 12;
  bytes committer = 13;
  int64 committer_time = 14;
  int32 committer_offset_minutes = 15;
  bool committer_truncated = 16;
  bool has_committer = 17;
  string previous_sha = 18;
  // Empty means the previous origin uses path; only renames need another path.
  bytes previous_path = 19;
  // Positive on the first line of a contiguous attribution group only.
  uint32 group_lines = 20;
}
message StreamEnd {}

// Read-only object, reference and history views. Arguments never invoke a shell.
message ViewRequest {
  string command = 1;
  repeated bytes arguments = 2;
  bytes path_prefix = 3;
  bytes mount_root = 4;
}
